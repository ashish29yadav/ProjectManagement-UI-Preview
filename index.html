<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Project Management — UI Preview</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}.top{background:#fff;border-bottom:1px solid #e4e8ef;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:16px;font-weight:700}.sub{font-size:12px;color:#6b7280;margin-top:4px}.actions{display:flex;gap:8px;align-items:center}.button{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid #d7dce5;border-radius:8px;background:white;color:#24324a;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}.button:hover,.button.active{background:#eef3ff;border-color:#9db6ff;color:#244fb4}.tabs{display:flex;gap:8px;padding:12px 24px;background:#fff;overflow:auto}.stage{padding:12px 16px 16px;flex:1;min-height:0}.framebox{height:calc(100vh - 132px);min-height:560px;background:#fff;border:1px solid #dce1e9;border-radius:10px;overflow:hidden}iframe{width:100%;height:100%;border:0;background:#fff}@media(max-width:650px){.top{padding:12px 14px;align-items:flex-start}.sub{max-width:200px}.tabs{padding:10px 14px}.stage{padding:8px}.framebox{height:calc(100vh - 145px);min-height:480px}.button{padding:8px 10px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">IT Project Management</div><div class="sub">Interactive UI proposal preview · choose a screen below</div></div><div class="actions"><a class="button" id="open" target="_blank" rel="noopener">Open screen in new tab ↗</a></div></header>
<nav class="tabs" aria-label="Preview screens">
<button class="button active" data-file="IT Project Management App – Dashboard.html">Dashboard</button>
<button class="button" data-file="NewProject.dc.html">New Project</button>
<button class="button" data-file="ProjectDetail.dc.html">Project Detail</button>
<button class="button" data-file="TaskBoard.dc.html">Task Board</button>
<button class="button" data-file="AdminUsers.dc.html">Users &amp; Roles</button>
</nav>
<main class="stage"><div class="framebox"><iframe id="preview" title="Selected proposal screen"></iframe></div></main>
<script>
const frame=document.getElementById('preview'),openLink=document.getElementById('open'),buttons=[...document.querySelectorAll('[data-file]')];
function select(file,updateHash=true){const url=new URL(file,location.href);frame.src=url.href;openLink.href=url.href;buttons.forEach(b=>{const active=b.dataset.file===file;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});if(updateHash)history.replaceState(null,'','#'+encodeURIComponent(file))}
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.file)));
const requested=decodeURIComponent(location.hash.slice(1));select(buttons.some(b=>b.dataset.file===requested)?requested:buttons[0].dataset.file,false);
</script>
</body>
</html>
